services:
  - type: web
    name: game-count-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: MAX_IMAGE_SIZE_MB
        value: "20"
    autoDeploy: true
